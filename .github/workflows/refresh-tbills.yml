name: Refresh T-bill rates
on:
  schedule:
    # ~9:30 America/New_York (14:30 UTC) weekdays — Treasury daily dump is usually out by then
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Treasury daily bill rates and auction results into data/rates.json
        run: python3 scripts/refresh_tbills.py
      - name: Commit if changed
        run: |
          git config user.name "cashpark-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --staged --quiet; then
            echo "No rate changes"
          else
            git commit -m "chore: refresh T-bill daily yields and auction rates"
            git push origin HEAD:main
          fi
